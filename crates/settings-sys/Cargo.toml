[package]
name = "settings-sys"
description = "Settings' clients for the system services (D-Bus, through zbus), without Qt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The blocking API only: every call runs on one of the app's worker threads.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
log.workspace = true

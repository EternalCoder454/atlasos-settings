[workspace]
resolver = "3"
members = ["crates/settings-registry", "crates/settings-sys", "apps/atlas-settings"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-settings"
rust-version = "1.89"

[workspace.dependencies]
# The atlas-framework crates (startup, settings, logging, crash reports,
# polkit, Flatpak); to move the pin, see CLAUDE.md. Atlas.Ui is not pinned
# here: it is the installed atlas-ui package.
atlas-framework-ui = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v1.6.0" }
log = { version = "0.4", features = ["std"] }
settings-registry = { path = "crates/settings-registry" }
settings-sys = { path = "crates/settings-sys" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

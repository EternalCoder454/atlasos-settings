[workspace]
resolver = "3"
members = ["crates/settings-registry", "crates/settings-sys", "crates/systemsettings-shim", "apps/telamon-settings"]

[workspace.package]
version = "0.4.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-settings"
rust-version = "1.89"

[workspace.dependencies]
# The atlas-framework crates (startup, settings, logging, crash reports,
# polkit, Flatpak); to move the pin, see CLAUDE.md. Telamon.Ui is not pinned
# here: it is the installed telamon-ui package.
telamon-framework-ui = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.0" }
log = { version = "0.4", features = ["std"] }
# Telamon Updater's Qt-free code (the Updates page's logic), pinned to a revision
# of atlasos-updater (CLAUDE.md, "Moving the telamon-updater-core pin").
telamon-updater-core = { git = "https://github.com/EternalCoder454/atlasos-updater", rev = "b481cf123ee314baad66f52b3f5414b34b92ebbb" }
settings-registry = { path = "crates/settings-registry" }
settings-sys = { path = "crates/settings-sys" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

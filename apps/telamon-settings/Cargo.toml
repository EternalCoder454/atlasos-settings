[package]
name = "telamon-settings"
description = "Settings: the settings app of Telamon OS (Kirigami UI over CXX-Qt)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not for crates.io: it depends on the workspace crates by path.
publish = false
build = "build.rs"

# CMake (Corrosion) links the static library into the C++ executable.
# `rlib` is there so `cargo test` and `cargo clippy` work as usual.
[lib]
name = "telamon_settings"
crate-type = ["staticlib", "rlib"]

[dependencies]
telamon-framework-ui.workspace = true
settings-registry.workspace = true
settings-sys.workspace = true
telamon-updater-core.workspace = true
# What the Updates page's backend uses of the framework directly (bootc types,
# os-release) and its async D-Bus calls.
telamon-framework-system = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.0" }
telamon-framework-core = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.0" }
tokio = { version = "1", features = ["rt", "time"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
log.workspace = true
serde_json = "1"

[dev-dependencies]
proptest.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"

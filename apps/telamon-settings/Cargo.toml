[package]
name = "telamon-settings"
description = "Settings: the settings app of Telamon OS (Kirigami UI over CXX-Qt)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

# CMake (Corrosion) links the static library into the C++ executable.
# `rlib` is there so `cargo test` and `cargo clippy` work as usual.
[lib]
name = "telamon_settings"
crate-type = ["staticlib", "rlib"]

[dependencies]
telamon-framework-ui.workspace = true
settings-registry.workspace = true
settings-sys.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
log.workspace = true
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"
